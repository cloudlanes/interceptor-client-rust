# The toolchain container spike/run.sh runs the Rust spike in: tokio + tokio-rustls.
SPIKE_IMAGE=rust:1.97-slim-bookworm
SPIKE_VOLUMES="-v intcp-spike-cargo:/usr/local/cargo/registry -v intcp-spike-rust-target:/target -e CARGO_TARGET_DIR=/target"
SPIKE_CMD="cargo run --quiet --release --example tls_spike"
