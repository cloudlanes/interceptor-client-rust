[package]
name = "interceptor-client"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Rust client for interceptor-server over the ion protocol"
license = "MIT"
repository = "https://github.com/cloudlanes/interceptor-client-rust"
publish = false

[dependencies]

[dev-dependencies]
# The TLS-stack spike's Ion codec (E13-T004), the version the server uses.
ion-rs = "1.1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
testcontainers = { version = "0.28", features = ["http_wait_plain"] }
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[[example]]
name = "tls_spike"
path = "spike/main.rs"

[[test]]
name = "conformance"
path = "conformance/conformance.rs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
